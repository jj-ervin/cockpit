[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockpit"
version = "0.1.0"
description = "Operator control surface for eco-governed AI workspaces"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "time-loc @ git+https://github.com/governancecommons/time-loc.git",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-playwright>=0.7",
]
package = [
    "pyinstaller>=6.0",
]

[project.scripts]
cockpit-install-phase1 = "cockpit.install_phase1:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]

[tool.hatch.build.targets.sdist]
include = ["src/cockpit"]
