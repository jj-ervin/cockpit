apiVersion: marlin/v1
kind: Package

metadata:
  name: cockpit-core
  version: 1.0.0
  description: Cockpit operator desktop runtime — Marlin-managed workspace UI and provider workflow
  author: jj-ervin
  homepage: https://github.com/jj-ervin/cockpit
  license: LicenseRef-Proprietary
  tags: [cockpit, workspace, governance, desktop]

platforms:
  windows:
    x64:
      artifact:
        type: github-release
        repo: jj-ervin/cockpit
        asset: cockpit-core-{version}-windows-x64.zip
        checksum:
          algorithm: sha256
          value: 4f876f853835e46099531cdfd7aa538c41cb66d1119b8373663e6b4900369a2c
      install:
        - step: command
          run: "Expand-Archive -Path \"{artifact}\" -DestinationPath \"{install_dir}\" -Force"
          shell: powershell
        - step: register_bin
          path: "{install_dir}\\Cockpit.exe"
          as: cockpit
      uninstall:
        - step: deregister_bin
          as: cockpit
        - step: remove_dir
          path: "{install_dir}"
    arm64:
      artifact:
        type: github-release
        repo: jj-ervin/cockpit
        asset: cockpit-core-{version}-windows-arm64.zip
        checksum:
          algorithm: sha256
          value: bea4c66151a21cf8d07db2e44cc507755e17e0faa3e078539be92fc8b1fad5fe
      install:
        - step: command
          run: "Expand-Archive -Path \"{artifact}\" -DestinationPath \"{install_dir}\" -Force"
          shell: powershell
        - step: register_bin
          path: "{install_dir}\\Cockpit.exe"
          as: cockpit
      uninstall:
        - step: deregister_bin
          as: cockpit
        - step: remove_dir
          path: "{install_dir}"
