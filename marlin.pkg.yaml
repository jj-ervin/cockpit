apiVersion: marlin/v1
kind: Package

metadata:
  name: cockpit-core
  version: 1.0.0
  description: Cockpit operator desktop runtime — Marlin-managed workspace UI and provider workflow
  author: jj-ervin
  homepage: https://github.com/jj-ervin/cockpit
  license: LicenseRef-Proprietary
  tags: [cockpit, workspace, governance, desktop]

platforms:
  windows:
    artifact:
      type: github-release
      repo: jj-ervin/cockpit
      asset: cockpit-core-{version}-windows-x64.zip
      checksum:
        algorithm: sha256
        value: af79263b367db790f68ff9d340d282ba7a0309a8b561e8df4104cb39062ff6cc
    install:
      - step: command
        run: "Expand-Archive -Path \"{artifact}\" -DestinationPath \"{install_dir}\" -Force"
        shell: powershell
      - step: register_bin
        path: "{install_dir}\\Cockpit.exe"
        as: cockpit
    uninstall:
      - step: deregister_bin
        as: cockpit
      - step: remove_dir
        path: "{install_dir}"

